name: Deploy naar GitHub Pages

on:
  push:
    branches:
      - main 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: GitHub Pages instellen
        uses: actions/configure-pages@v4

      - name: Bestanden uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Website live zetten
        id: deployment
        uses: actions/deploy-pages@v4
